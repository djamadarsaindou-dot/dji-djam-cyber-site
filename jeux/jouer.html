<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jouer — Arcade Dji Djam Cyber</title>
  <meta name="description" content="Joue gratuitement sur l'arcade Dji Djam Cyber.">
  <meta name="theme-color" content="#050918">
  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/arcade.css">
  <style>
    .play { padding: 28px 0 10px; }
    .crumbs { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; margin-bottom: 18px; }
    .crumbs a:hover { color: var(--gold); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 26px; align-items: start; }
    @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }

    /* --- l'écran de jeu --- */
    .stage-box {
      position: relative; border-radius: 26px; padding: 14px;
      background: linear-gradient(160deg, var(--surface-2), var(--bg-2));
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow), 0 0 90px -30px var(--accent, var(--gold));
    }
    .stage {
      position: relative; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #000;
      width: 100%;
    }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    .stage:fullscreen { border-radius: 0; width: 100vw !important; height: 100vh !important; max-height: none !important; }
    .stage-bar { display: flex; align-items: center; gap: 10px; padding: 12px 4px 2px; flex-wrap: wrap; }
    .stage-bar .title { font-family: var(--font-title); font-size: 18px; margin-right: auto; display: flex; align-items: center; gap: 10px; }
    .rotate-hint {
      display: none; margin: 10px 4px 0; padding: 10px 14px; border-radius: 12px; font-size: 14px;
      background: rgba(242,193,78,.12); color: var(--gold); border: 1px solid rgba(242,193,78,.3);
    }
    @media (orientation: portrait) and (max-width: 700px) { .rotate-hint.show { display: block; } }

    /* --- infos à droite --- */
    .side { display: flex; flex-direction: column; gap: 18px; }
    .box { padding: 24px; border-radius: var(--radius); background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); }
    .box h1 { font-family: var(--font-title); font-size: 26px; line-height: 1.15; margin: 10px 0 6px; letter-spacing: -0.4px; }
    .box h2 { font-family: var(--font-title); font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
    .box p { color: var(--muted); margin: 0; }
    .big-emoji { font-size: 44px; line-height: 1; }
    .controls { display: grid; gap: 10px; }
    .controls div { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .facts div { padding: 12px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
    .facts b { display: block; color: var(--text); font-size: 15px; }
    .facts span { color: var(--muted); font-size: 13px; }
    .notfound { text-align: center; padding: 120px 20px; }
    .notfound h1 { font-family: var(--font-title); font-size: 34px; }
    .toast {
      position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px); opacity: 0;
      background: var(--gold); color: #1a1300; font-weight: 700; padding: 12px 20px; border-radius: 14px;
      transition: all .25s; z-index: 100; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="./">
        <img src="../logo.png" alt="">
        <span class="long">Dji Djam Cyber</span>
        <small>ARCADE</small>
      </a>
      <nav class="nav">
        <a href="./#jeux">Tous les jeux</a>
        <a class="pro" href="../">Le cyber ↗</a>
      </nav>
    </div>
  </header>

  <main class="wrap play" id="main"></main>

  <section class="wrap section" id="more" style="padding-top:40px">
    <div class="section-head">
      <div>
        <span class="eyebrow">Continue de jouer</span>
        <h2>D'autres jeux</h2>
      </div>
      <a class="btn btn-ghost btn-sm" href="./#jeux">Voir tout le catalogue →</a>
    </div>
    <div class="games-grid" id="moreGrid"></div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div><strong style="color:var(--text)">Dji Djam Cyber</strong> · Arcade</div>
      <div class="links">
        <a href="./">Les jeux</a>
        <a href="../">Le cyber</a>
        <a href="mailto:djidjamcyber@gmail.com">Contact</a>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="assets/catalogue.js"></script>
  <script>
    const games = window.ARCADE_GAMES;
    const slug = new URLSearchParams(location.search).get("jeu");
    const game = games.find((g) => g.slug === slug);
    const main = document.getElementById("main");
    const escapeHTML = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    if (!game) {
      main.innerHTML = `
        <div class="notfound">
          <div style="font-size:70px">🕹️</div>
          <h1>Ce jeu n'existe pas (encore !)</h1>
          <p style="color:var(--muted)">Retourne au catalogue pour choisir un jeu.</p>
          <a class="btn btn-gold" href="./#jeux">Voir les jeux</a>
        </div>`;
    } else {
      document.title = `${game.title} — Arcade Dji Djam Cyber`;
      document.body.style.setProperty("--accent", game.accent);
      const ratio = game.orientation === "portrait" ? 480 / 800 : 960 / 540;
      const p = game.progress && game.progress();

      main.innerHTML = `
        <div class="crumbs"><a href="./">Arcade</a> <span>›</span> <span>${escapeHTML(game.title)}</span></div>
        <div class="layout">
          <div class="stage-box">
            <div class="stage" id="stage">
              <iframe id="frame" src="${game.path}" title="${escapeHTML(game.title)}" allow="fullscreen; autoplay" allowfullscreen></iframe>
            </div>
            <div class="stage-bar">
              <div class="title">${game.emoji} ${escapeHTML(game.title)}</div>
              <button class="icon-btn" id="reload" title="Recommencer depuis le début">↻</button>
              <button class="icon-btn" id="share" title="Partager le jeu">🔗</button>
              <button class="btn btn-gold btn-sm" id="fs">⛶ Plein écran</button>
            </div>
            ${game.orientation === "paysage" ? '<div class="rotate-hint show">📱 Astuce : tourne ton téléphone à l\'horizontale ou passe en plein écran pour mieux voir.</div>' : ""}
          </div>
          <aside class="side">
            <div class="box">
              <div class="big-emoji">${game.emoji}</div>
              <h1>${escapeHTML(game.title)}</h1>
              <p style="color:var(--gold);font-weight:600;margin-bottom:12px">${escapeHTML(game.tagline)}</p>
              <p>${escapeHTML(game.description)}</p>
            </div>
            <div class="box">
              <h2>Commandes</h2>
              <div class="controls">
                ${game.controls.map(([k, v]) => `<div><kbd>${escapeHTML(k)}</kbd><span>${escapeHTML(v)}</span></div>`).join("")}
                ${game.touch ? '<div><kbd>📱</kbd><span>boutons tactiles sur téléphone</span></div>' : ""}
              </div>
            </div>
            <div class="box">
              <h2>En bref</h2>
              <div class="facts">
                <div><b>${escapeHTML(game.content)}</b><span>à finir</span></div>
                <div><b>${"★".repeat(game.difficulty)}${"☆".repeat(5 - game.difficulty)}</b><span>difficulté</span></div>
                <div><b>${escapeHTML(game.duration)}</b><span>durée</span></div>
                <div><b>${p ? escapeHTML(p.label) : "Pas encore joué"}</b><span>ta progression</span></div>
              </div>
            </div>
          </aside>
        </div>`;

      // taille de l'écran de jeu : la plus grande possible sans dépasser la hauteur de la fenêtre
      const stage = document.getElementById("stage");
      function fit() {
        if (document.fullscreenElement) return;
        const maxH = window.innerHeight - 190;
        const w = stage.parentElement.clientWidth - 28;
        let width = w, height = w / ratio;
        if (height > maxH && maxH > 300) { height = maxH; width = height * ratio; }
        stage.style.width = width + "px";
        stage.style.height = height + "px";
      }
      window.addEventListener("resize", fit);
      document.addEventListener("fullscreenchange", fit);
      fit();

      const frame = document.getElementById("frame");
      frame.addEventListener("load", () => { try { frame.contentWindow.focus(); } catch (e) {} });

      document.getElementById("fs").onclick = () => {
        const el = stage;
        (el.requestFullscreen || el.webkitRequestFullscreen || (() => toast("Plein écran non disponible ici"))).call(el);
        setTimeout(() => { try { frame.contentWindow.focus(); } catch (e) {} }, 300);
      };
      document.getElementById("reload").onclick = () => { frame.src = game.path; };
      document.getElementById("share").onclick = async () => {
        const data = { title: game.title, text: `${game.title} — ${game.tagline}`, url: location.href };
        if (navigator.share) { try { await navigator.share(data); } catch (e) {} return; }
        try { await navigator.clipboard.writeText(location.href); toast("Lien copié ! Envoie-le à tes amis 🎉"); }
        catch (e) { toast(location.href); }
      };
    }

    // autres jeux
    const others = games.filter((g) => g.slug !== slug);
    if (!others.length) document.getElementById("more").style.display = "none";
    document.getElementById("moreGrid").innerHTML = others.map((g) => `
      <article class="card" style="--accent:${g.accent}">
        <a class="card-link" href="jouer.html?jeu=${g.slug}" aria-label="Jouer à ${escapeHTML(g.title)}"></a>
        <div class="card-cover">
          <img src="${g.cover}" alt="" loading="lazy" class="${g.orientation === "portrait" ? "portrait" : ""}">
          <div class="card-play"><span>▶</span></div>
          <div class="card-emoji">${g.emoji}</div>
        </div>
        <div class="card-body">
          <h3>${escapeHTML(g.title)}</h3>
          <p class="tagline">${escapeHTML(g.tagline)}</p>
          <div class="card-actions"><a class="btn btn-gold btn-sm" href="jouer.html?jeu=${g.slug}">▶ Jouer</a></div>
        </div>
      </article>`).join("");
  </script>
</body>
</html>
